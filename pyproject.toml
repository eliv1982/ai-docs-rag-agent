[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-docs-rag-agent"
version = "0.1.0"
description = "Grounded RAG over self-indexed technical docs: SSRF-aware ingestion and a bounded Telegram tool-calling agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eliv1982" }]
keywords = ["rag", "langchain", "pinecone", "telegram-bot", "ssrf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langchain>=1.3.0,<2",
    "langchain-core>=1.4.0,<2",
    "langgraph>=1.2.0,<2",
    "pinecone>=9,<10",
    "langchain-openai>=1,<2",
    "openai>=1.109.1,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "langchain-text-splitters>=1,<2",
    "python-telegram-bot>=22,<23",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Repository = "https://github.com/eliv1982/ai-docs-rag-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_docs_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
